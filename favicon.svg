<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bodyGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <!-- Chân nhỏ đung đưa -->
  <g stroke="#3b2a12" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M40 88 C 34 92, 30 96, 26 102"/>
    <path d="M48 92 C 44 97, 41 101, 38 107"/>
    <path d="M57 94 C 55 99, 54 103, 52 109"/>
  </g>

  <!-- Cánh (sau thân, màu xanh nhạt trong suốt, viền mảnh) -->
  <g stroke="#7dd3fc" stroke-width="1.5" fill="#e0f2fe" fill-opacity="0.85">
    <path d="M50 45 C 30 30, 14 32, 10 48 C 8 60, 20 66, 34 62 C 44 59, 50 52, 50 45 Z"/>
    <path d="M56 40 C 42 20, 26 16, 18 28 C 12 38, 20 48, 34 48 C 44 48, 54 46, 56 40 Z"/>
  </g>

  <!-- Ngòi nhỏ phía đuôi -->
  <path d="M28 96 L20 100 L27 104 Z" fill="#3b2a12"/>

  <!-- Thân ong (nghiêng chéo, thon dài) -->
  <ellipse cx="52" cy="78" rx="30" ry="21" fill="url(#bodyGrad2)" stroke="#3b2a12" stroke-width="2.8" transform="rotate(-28 52 78)"/>

  <!-- 2 vằn đen trên thân -->
  <g transform="rotate(-28 52 78)" fill="#2b1c0d">
    <rect x="38" y="62" width="10" height="34" rx="4"/>
    <rect x="56" y="62" width="10" height="34" rx="4"/>
  </g>

  <!-- Đầu ong -->
  <circle cx="80" cy="46" r="22" fill="url(#bodyGrad2)" stroke="#3b2a12" stroke-width="2.8"/>

  <!-- Râu, đầu chấm tròn -->
  <path d="M72 28 C 68 16, 64 12, 58 8" stroke="#3b2a12" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M88 26 C 92 14, 97 10, 103 7" stroke="#3b2a12" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <circle cx="58" cy="8" r="4" fill="#3b2a12"/>
  <circle cx="103" cy="7" r="4" fill="#3b2a12"/>

  <!-- Má hồng -->
  <circle cx="66" cy="52" r="5.5" fill="#fb923c" opacity="0.6"/>
  <circle cx="94" cy="52" r="5.5" fill="#fb923c" opacity="0.6"/>

  <!-- Mắt to tròn, có highlight lấp lánh -->
  <circle cx="72" cy="42" r="7" fill="#1f1308"/>
  <circle cx="90" cy="42" r="7" fill="#1f1308"/>
  <circle cx="74.3" cy="39.5" r="2.3" fill="#ffffff"/>
  <circle cx="92.3" cy="39.5" r="2.3" fill="#ffffff"/>
  <circle cx="70" cy="45" r="1" fill="#ffffff" opacity="0.8"/>
  <circle cx="88" cy="45" r="1" fill="#ffffff" opacity="0.8"/>

  <!-- Miệng cười -->
  <path d="M75 53 Q81 58 87 53" stroke="#3b2a12" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</svg>
